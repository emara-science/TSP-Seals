<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>XO — لعبة إكس أو</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131f32;--line:#26364e;--text:#f3f6fb;--muted:#9aabc2;--accent:#67e8c0;--x:#76b7ff;--o:#ffbd75}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#1b2b44 0,#0b1220 58%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:22px 14px calc(22px + env(safe-area-inset-bottom))}
main{width:min(100%,460px);display:flex;flex-direction:column;gap:16px}
header{text-align:center;padding:8px 0}h1{font-size:clamp(2rem,9vw,3rem);margin:0;letter-spacing:2px}header p{margin:5px 0 0;color:var(--muted);font-size:.95rem}
.panel{background:rgba(19,31,50,.92);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 14px 35px #0003}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode button,.actions button{border:1px solid var(--line);border-radius:13px;background:#1a2940;color:var(--text);font:inherit;font-weight:700;padding:12px;min-height:46px;cursor:pointer}.mode button.active{border-color:var(--accent);background:#153a3a;color:var(--accent)}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.score div{text-align:center;background:#0d1728;border:1px solid var(--line);border-radius:14px;padding:10px 4px}.score strong{display:block;font-size:1.45rem}.score span{font-size:.78rem;color:var(--muted)}
.status{text-align:center;font-weight:750;font-size:1.1rem;margin:16px 0 12px;min-height:28px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;direction:ltr}
.cell{aspect-ratio:1;border:1px solid #30435f;border-radius:17px;background:linear-gradient(145deg,#1a2a42,#101b2d);font-size:clamp(2.7rem,16vw,4.4rem);font-weight:850;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:transform .12s,border-color .12s}
.cell:active{transform:scale(.96)}.cell:disabled{cursor:default}.cell.x{color:var(--x)}.cell.o{color:var(--o)}.cell.win{border-color:var(--accent);background:#163b3a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.actions button.primary{background:var(--accent);border-color:var(--accent);color:#08231e}
.hint{text-align:center;color:var(--muted);font-size:.82rem;margin:0}footer{text-align:center;color:#74869f;font-size:.75rem;padding:4px}
</style>
</head>
<body>
<main>
<header><h1>XO <span style="color:var(--accent)">✦</span></h1><p>لعبة إكس أو — خفيفة وتشتغل أوفلاين</p></header>
<section class="panel">
  <div class="mode"><button id="two" class="active" type="button">لاعبان</button><button id="cpu" type="button">ضد الكمبيوتر</button></div>
  <div class="score"><div><strong id="sx">0</strong><span id="lx">اللاعب X</span></div><div><strong id="sd">0</strong><span>تعادل</span></div><div><strong id="so">0</strong><span id="lo">اللاعب O</span></div></div>
  <div class="status" id="status" aria-live="polite">دور اللاعب X</div>
  <div class="board" id="board" aria-label="لوحة لعبة إكس أو">
    <button class="cell" data-i="0" aria-label="الخانة 1"></button><button class="cell" data-i="1" aria-label="الخانة 2"></button><button class="cell" data-i="2" aria-label="الخانة 3"></button>
    <button class="cell" data-i="3" aria-label="الخانة 4"></button><button class="cell" data-i="4" aria-label="الخانة 5"></button><button class="cell" data-i="5" aria-label="الخانة 6"></button>
    <button class="cell" data-i="6" aria-label="الخانة 7"></button><button class="cell" data-i="7" aria-label="الخانة 8"></button><button class="cell" data-i="8" aria-label="الخانة 9"></button>
  </div>
  <div class="actions"><button class="primary" id="restart" type="button">جولة جديدة</button><button id="reset" type="button">تصفير النتائج</button></div>
</section>
<p class="hint">اختار وضع اللعب، واضغط على أي خانة للبدء.</p><footer>XO • Mobile Edition</footer>
</main>
<script>
(()=>{
 const cells=[...document.querySelectorAll('.cell')],status=document.getElementById('status');
 const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 let board=Array(9).fill(''),turn='X',over=false,mode='two',scores={X:0,O:0,D:0};
 const $=id=>document.getElementById(id);
 function paint(){cells.forEach((c,i)=>{c.textContent=board[i];c.className='cell'+(board[i]?' '+board[i].toLowerCase():'');c.disabled=!!board[i]||over||(mode==='cpu'&&turn==='O');});$('sx').textContent=scores.X;$('so').textContent=scores.O;$('sd').textContent=scores.D;$('lx').textContent='اللاعب X';$('lo').textContent=mode==='cpu'?'الكمبيوتر O':'اللاعب O';}
 function winner(b=board){for(const line of wins){const [a,c,d]=line;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return {mark:b[a],line};}return null;}
 function finish(){const w=winner();if(w){over=true;scores[w.mark]++;status.textContent=w.mark==='X'?'🎉 اللاعب X كسب!':(mode==='cpu'?'الكمبيوتر كسب الجولة':'🎉 اللاعب O كسب!');w.line.forEach(i=>cells[i].classList.add('win'));}else if(board.every(Boolean)){over=true;scores.D++;status.textContent='تعادل! 🤝';}paint();}
 function move(i){if(over||board[i]||(mode==='cpu'&&turn==='O'))return;board[i]=turn;const w=winner();if(w||board.every(Boolean)){finish();return;}turn=turn==='X'?'O':'X';status.textContent=mode==='cpu'&&turn==='O'?'الكمبيوتر بيفكر…':'دور اللاعب '+turn;paint();if(mode==='cpu'&&turn==='O')setTimeout(cpuMove,300);}
 function cpuMove(){if(over)return;let best=-1,score=-Infinity;for(let i=0;i<9;i++)if(!board[i]){board[i]='O';let s=minimax(board,false);board[i]='';if(s>score){score=s;best=i;}}if(best>=0){board[best]='O';if(winner()||board.every(Boolean)){finish();return;}turn='X';status.textContent='دورك — اللاعب X';paint();}}
 function minimax(b,maximizing){const w=winner(b);if(w)return w.mark==='O'?10:-10;if(b.every(Boolean))return 0;let best=maximizing?-Infinity:Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]=maximizing?'O':'X';const s=minimax(b,!maximizing);b[i]='';best=maximizing?Math.max(best,s):Math.min(best,s);}return best;}
 function newRound(){board=Array(9).fill('');turn='X';over=false;status.textContent='دور اللاعب X';paint();}
 cells.forEach(c=>c.addEventListener('click',()=>move(+c.dataset.i)));
 $('two').onclick=()=>setMode('two');$('cpu').onclick=()=>setMode('cpu');
 function setMode(m){mode=m;$('two').classList.toggle('active',m==='two');$('cpu').classList.toggle('active',m==='cpu');newRound();paint();}
 $('restart').onclick=newRound;$('reset').onclick=()=>{scores={X:0,O:0,D:0};newRound();};paint();
})();
</script>
</body>
</html>
